schema_version: yaha.modeling-runtime/v1
blender_path: auto
allowed_version: '4.5'
timeout_seconds: 300
max_faces: 200000
max_output_mb: 40
photo_review:
  max_revisions: 2
  timeout_seconds: 1200
  min_mean_iou: 0.65
  min_view_iou: 0.5
  min_observed_ratio: 0.75
outline_fitting:
  enabled: true
  max_seconds: 180
  iterations: 12
  max_displacement_ratio: 0.08
