schema_version: yaha.reconstruction/v2
openmvs_path: auto
min_photos: 3
max_photos: 96
max_input_mb: 128
max_image_size: 2400
threads: 8
timeout_seconds: 3600
registration_policy: progressive
# 低于此比例提示补充照片；不丢弃已通过几何校验的有效观测。
min_registered_ratio: 0.75
min_registered_views: 3
min_sparse_points: 200
max_reprojection_error_px: 2
min_blur_score: 12
min_features: 100
camera_model: SIMPLE_RADIAL
estimate_affine_shape: true
domain_size_pooling: true
guided_matching: true
depth_resolution_level: 0
max_texture_size: 4096
voxel_mm: 0.25
max_removed_volume_ratio: 0.02
photo_texture_size: 2048
min_textured_surface_ratio: 0.9
